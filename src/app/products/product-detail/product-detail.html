<div class="flex  gap-4">
  <div class="aspect-square bg-gray-100 w-[80vh]  h-[80vh] overflow-hidden mb-4">
    <img
      [src]="product.image"
      class=" object-cover w-[80vh]  h-[80vh] group-hover:scale-105 transition-transform duration-300"
    />
  </div>

  <div class="space-y-1">
    <p class="text-gray-500 text-sm">{{ product.category }}</p>
    <h3 class="text-pink-400 text-3xl font-bold">{{ product.name }}</h3>
    <p class="text-black text-xl">R$ {{ product.price }}</p>
    <form [formGroup]="formGroup">
      <div >
        <h6>Quantidade</h6>
        <button class="border rounded-sm w-4" (click)="incrementar()">+</button>
        <input type="text" class="border text-center  m-2 rounded-sm w-8" formControlName="quantity" />
        <button class="border  rounded-sm w-4" (click)="decrementar()">-</button>
      </div>

      <div >
        <p>Observações</p>
        <textarea class="border mt-2 rounded-sm" formControlName="observations"></textarea>
      </div>
    </form>

    <button (click)="addToCart()" class="ml-auto p-4 bg-rose-500 hover:bg-rose-600  text-white rounded cursor-pointer">
      Adicionar ao carrinho
    </button>
  </div>
</div>
