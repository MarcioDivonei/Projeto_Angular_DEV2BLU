<div class="group  bg-white rounded-2xl shadow-md hover:shadow-lg transition-shadow duration-300">
  
    <div class="aspect-square rounded-t-2xl bg-gray-100 overflow-hidden">
      <img
        [routerLink]="['/product', product.id]"
        [src]="product.image"
        alt="{{ product.name }}"
        class="w-full h-full object-cover cursor-pointer group-hover:scale-105 transition-transform duration-300"
      />
    </div>

    <div class="space-y-2 p-4">
      <p class="text-gray-500 text-sm">{{ product.category }}</p>
      <h3 class="text-pink-400 text-lg font-bold">{{ product.name }}</h3>
      <p class="text-gray-600 text-sm leading-snug">{{ product.description }}</p>
    </div>
  

  <div class="flex items-center justify-between px-4 pb-4">
    <p class="text-black font-semibold">{{ product.price | currency: "BRL"}}</p>
    <button
      [routerLink]="['/product', product.id]"
      class="px-4 py-2 cursor-pointer bg-pink-400 hover:bg-pink-500 text-white rounded-full transition-colors duration-300"
    >
      Ver Detalhes
    </button>
  </div>
</div>
