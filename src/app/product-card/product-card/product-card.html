<div class="group m cursor-pointer border-2 border-white rounded-2xl">
  <a [routerLink]="['/product', product.id]">
    <div class="aspect-square rounded-t-2xl bg-gray-100 overflow-hidden mb-4">
      <img
        [src]="product.image"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
      />
    </div>

    <div class="space-y-1 p-4">
      <p class="text-gray-500 text-sm">{{ product.category }}</p>
      <h3 class="text-pink-400 text-lg font-bold">{{ product.name }}</h3>
      <p class="text-black">R$ {{ product.price }}</p>
    </div>
  </a>
  <div class="flex p-4">
    <button class="p-4 rounded cursor-pointer" [routerLink]="['/product', product.id]">
      Detalhes
    </button>
    <button
      class="p-4 bg-slate-600 hover:bg-slate-700 text-white rounded cursor-pointer"
      (click)="delete()"
    >
      Excluir
    </button>
    <button (click)="addToCart()"
      class="ml-auto p-4 bg-rose-500 hover:bg-rose-600 text-white rounded cursor-pointer justify-end"
    >
      Adicionar ao Carrinho
    </button>
  </div>
</div>
